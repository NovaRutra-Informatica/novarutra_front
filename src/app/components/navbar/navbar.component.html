<nav [class.scrolled]="isScrolled()" aria-label="Navegação principal">
    <div class="container">
        <a href="#inicio" class="logo-area" aria-label="NovaRutra — Início">
            <img
                src="assets/logos/LOGO_WHITE-WITHOUT_BACKGROUND-90.webp"
                srcset="
                    assets/logos/LOGO_WHITE-WITHOUT_BACKGROUND-90.webp 1x,
                    assets/logos/LOGO_WHITE-WITHOUT_BACKGROUND-180.webp 2x
                "
                alt="Logotipo NovaRutra"
                class="logo-img"
                width="45"
                height="45"
                decoding="async"
            />
            <span class="logo-text">NOVARUTRA</span>
        </a>

        <button
            class="mobile-toggle"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="isMobileMenuOpen()"
            aria-controls="main-menu"
            aria-label="Abrir menu"
        >
            <span [class.open]="isMobileMenuOpen()"></span>
            <span [class.open]="isMobileMenuOpen()"></span>
            <span [class.open]="isMobileMenuOpen()"></span>
        </button>

        <ul id="main-menu" class="menu" [class.active]="isMobileMenuOpen()">
            <li><a href="#inicio" (click)="closeMenu()">Início</a></li>
            <li><a href="#sobre" (click)="closeMenu()">Sobre</a></li>
            <li><a href="#servicos" (click)="closeMenu()">Serviços</a></li>
            <li><a href="#clientes" (click)="closeMenu()">Clientes</a></li>
            <li>
                <a href="#contato" class="btn-contact" (click)="closeMenu()">
                    Contato
                </a>
            </li>
        </ul>
    </div>
</nav>
