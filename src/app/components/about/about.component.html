<section id="sobre" class="about-section">
    <div class="container">
        <div class="about-grid">
            <div class="about-text" appFadeIn>
                <h3 class="section-tag">Quem Somos</h3>
                <h2 class="about-title">
                    Você fala direto<br />
                    com o <span class="text-highlight">especialista</span>
                </h2>
                <app-terminal [text]="terminalText"></app-terminal>

                <ul class="differentials-list">
                    @for (d of differentials; track d.text) {
                        <li>
                            <span class="diff-icon">
                                <i [class]="d.icon"></i>
                            </span>
                            <span>{{ d.text }}</span>
                        </li>
                    }
                </ul>
            </div>

            <div class="about-visual" appFadeIn>
                <div class="profile-card">
                    <div class="experience-badge">
                        <span class="exp-num">5+</span>
                        <span class="exp-label">anos</span>
                    </div>

                    <div class="profile-icon-wrap">
                        <i class="fas fa-user-cog"></i>
                    </div>

                    <div class="profile-info">
                        <h3 class="profile-name">Alessandro Lima</h3>
                        <p class="profile-role">Técnico Especialista em T.I.</p>
                        <div class="profile-meta">
                            <span
                                ><i class="fas fa-building"></i> NovaRutra
                                Informática</span
                            >
                            <span
                                ><i class="fas fa-map-marker-alt"></i> São Paulo
                                — Capital</span
                            >
                        </div>
                    </div>

                    <div class="tech-chips">
                        @for (tech of techs; track tech) {
                            <span class="chip">{{ tech }}</span>
                        }
                    </div>
                </div>

                <div class="floating-card card-top-left">
                    <i class="fas fa-laptop-medical"></i>
                    <span>Hardware</span>
                </div>
                <div class="floating-card card-bottom-right">
                    <i class="fas fa-server"></i>
                    <span>Servidores</span>
                </div>
            </div>
        </div>
    </div>
</section>
