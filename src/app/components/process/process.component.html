<section class="process-section" id="como-trabalhamos">
    <div class="container">
        <header class="section-header">
            <h3 class="section-tag">Nosso Método</h3>
            <h2>Como funciona o atendimento</h2>
        </header>

        <ol class="timeline" aria-label="Etapas do atendimento">
            @for (step of steps; track step.number; let i = $index) {
                <li
                    class="timeline-item"
                    [class.item-left]="i % 2 === 0"
                    [class.item-right]="i % 2 !== 0"
                >
                    <article class="step-card" appFadeIn>
                        <header class="step-header">
                            <div class="step-icon" aria-hidden="true">
                                <i [class]="step.icon"></i>
                            </div>
                            <span
                                class="step-num"
                                aria-label="Etapa {{ step.number }}"
                                >{{ step.number }}</span
                            >
                        </header>
                        <h3>{{ step.title }}</h3>
                        <p>{{ step.desc }}</p>
                    </article>
                </li>
            }
        </ol>
    </div>
</section>
